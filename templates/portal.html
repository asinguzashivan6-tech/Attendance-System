{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-8 col-lg-7">
        <div class="text-center mb-4">
            <h2 class="fw-bold">{{ brand.institution_name }}</h2>
            <p class="text-muted">Choose your login portal</p>
        </div>

        <div class="row g-3">
            <div class="col-md-4">
                <a href="{{ url_for('admin_login') }}" class="text-decoration-none">
                    <div class="card h-100 shadow-sm text-center">
                        <div class="card-body">
                            <h5>Admin</h5>
                            <p class="text-muted small mb-0">Administrator login</p>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-md-4">
                <a href="{{ url_for('teacher_login') }}" class="text-decoration-none">
                    <div class="card h-100 shadow-sm text-center">
                        <div class="card-body">
                            <h5>Lecturer</h5>
                            <p class="text-muted small mb-0">Staff / teacher login</p>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-md-4">
                <a href="{{ url_for('student_login') }}" class="text-decoration-none">
                    <div class="card h-100 shadow-sm text-center">
                        <div class="card-body">
                            <h5>Student</h5>
                            <p class="text-muted small mb-0">Scan &amp; view history</p>
                        </div>
                    </div>
                </a>
            </div>
        </div>

        <p class="text-center mt-4 mb-0">New student? <a href="{{ url_for('student_register') }}">Create an account</a></p>
        <p class="text-center text-muted small mt-2">Lecturer accounts are created by the administrator.</p>
    </div>
</div>
{% endblock %}
