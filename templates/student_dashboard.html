{% extends "base.html" %}

{% block content %}
<div class="mt-4">
    <h2>Student Dashboard</h2>
    <p class="text-muted">Welcome, {{ session.get('name') }}!</p>
    <hr>

    <div class="row">
        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center py-5">
                    <h4 class="mb-3">Scan QR Code</h4>
                    <p class="text-muted">Use your camera to scan the rotating QR shown by your teacher</p>
                    <a href="{{ url_for('scan') }}" class="btn btn-primary btn-lg mt-2">Open Scanner</a>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-body text-center py-5">
                    <h4 class="mb-3">My Attendance History</h4>
                    <p class="text-muted">View all your past attendance records</p>
                    <button class="btn btn-outline-primary btn-lg mt-2" disabled>Coming Next</button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
