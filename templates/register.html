{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="text-center mb-1">Create Student Account</h3>
                <p class="text-center text-muted small mb-4">{{ brand.institution_name }}</p>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="name" class="form-control" minlength="2" maxlength="100"
                            pattern="[A-Za-z][A-Za-z .'\-]*"
                            title="Letters, spaces, apostrophes, hyphens and dots only" required
                            value="{{ form.get('name', '') }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" maxlength="120" required
                            placeholder="name@university.ac.ke" value="{{ form.get('email', '') }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" minlength="8" maxlength="128"
                            pattern="(?=.*[A-Za-z])(?=.*\d).{8,}"
                            title="At least 8 characters, including a letter and a number" required>
                        <small class="text-muted">At least 8 characters, with a letter and a number.</small>
                    </div>
                    <div class="d-grid">
                        <button class="btn btn-brand">Register</button>
                    </div>
                </form>
                <p class="text-center mt-3 mb-0">Already registered? <a
                        href="{{ url_for('student_login') }}">Student login</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
